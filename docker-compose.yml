services:
  postgres:
    image: postgres:18
    container_name: inventario-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventario
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: inventario-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/inventario
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: inventario-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: